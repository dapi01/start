<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SpringBoot</title>
</head>
<body>
<h3>thymeleaf for</h3>
<p th:each="one:${names}">
    <span th:text="${one}"></span>
</p>

<ul>
    <li th:each="one : ${names}" th:text="${one}"/>
</ul>
</body>
</html>
