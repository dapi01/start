<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>
<body>
<div th:each="one: ${book}">
  <h3 th:text="${one.author}"></h3>
  <p>
        <span th:text="${one.title}">
        </span>
  </p>

</div>
</body>
</html>
